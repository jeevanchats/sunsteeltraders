# Security headers for the pages Nginx proxies to the SSR server. deploy.sh installs this as
# /etc/nginx/snippets/sunsteel-security.conf and includes it in `location /` and `location /admin`.
# Not included for /api/: the API sends its own copies, and doubling them would send each header twice.
# `always` keeps them on error pages. No Content-Security-Policy yet: Google Analytics and inline scripts need a tuned one.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Strict-Transport-Security "max-age=2592000" always;
